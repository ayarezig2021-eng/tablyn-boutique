<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio: Design Your Smart QR Menu Card | Tablyn Tunisia</title>
  <meta name="description" content="Design your custom smart card with a real QR menu code: choose the material, shape, colours, text and artwork, see it live, then add it to your basket.">
  <link rel="canonical" href="https://tablyn-boutique.vercel.app/studio.html">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script>
    try {
      var th = localStorage.getItem('tf_theme');
      if (!th) th = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', th === 'dark');
    } catch (e) { }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:250 250 249; --surface:255 255 255; --surface2:244 244 245; --line:228 228 231; --fg:24 24 27; --muted:113 113 122; --brand:79 70 229; }
    .dark { --bg:13 14 17; --surface:22 24 29; --surface2:29 32 39; --line:42 46 56; --fg:236 238 243; --muted:160 164 176; --brand:129 140 248; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: Inter, Cairo, system-ui, sans-serif; background: rgb(var(--bg)); color: rgb(var(--fg)); line-height: 1.5; }
    [dir="rtl"] body { font-family: Cairo, Inter, system-ui, sans-serif; }
    a { color: rgb(var(--brand)); }
    header { position: sticky; top: 0; z-index: 10; background: rgb(var(--surface)); border-bottom: 1px solid rgb(var(--line)); }
    .bar { max-width: 1120px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; color: rgb(var(--fg)); text-decoration: none; margin-inline-end: auto; }
    .logo i { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: rgb(var(--brand)); color: #fff; font-style: normal; }
    main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.7rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 0 0 12px; }
    .muted { color: rgb(var(--muted)); font-size: .92rem; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; margin-top: 20px; align-items: start; }
    @media (max-width: 920px) { .layout { grid-template-columns: 1fr; } .preview { order: -1; position: static !important; } }
    section.card { background: rgb(var(--surface)); border: 1px solid rgb(var(--line)); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .preview { position: sticky; top: 76px; }
    label { display: block; font-weight: 600; font-size: .85rem; margin: 10px 0 4px; }
    input[type=text], input[type=url], input[type=number], select { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid rgb(var(--line)); background: rgb(var(--bg)); color: rgb(var(--fg)); font: inherit; }
    input[type=range] { width: 100%; }
    input[type=color] { width: 100%; height: 40px; border: 1px solid rgb(var(--line)); border-radius: 10px; background: transparent; padding: 2px; cursor: pointer; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 999px; border: 1px solid rgb(var(--line)); background: rgb(var(--surface)); color: rgb(var(--fg)); font: 600 .9rem inherit; font-family: inherit; cursor: pointer; text-decoration: none; }
    .btn:hover { background: rgb(var(--surface2)); }
    .btn.primary { background: rgb(var(--brand)); border-color: rgb(var(--brand)); color: #fff; }
    .btn.danger { color: #dc2626; border-color: #fca5a5; }
    .btn.small { padding: 6px 12px; font-size: .82rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .sw { width: 44px; height: 32px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; position: relative; padding: 0; outline: 1px solid rgb(var(--line)); }
    .sw i { position: absolute; inset-inline-end: 4px; bottom: 4px; width: 12px; height: 12px; border-radius: 50%; }
    .sw.on { border-color: rgb(var(--brand)); }
    .stage { display: grid; place-items: center; min-height: 400px; border-radius: 16px; background: repeating-conic-gradient(rgb(var(--surface2)) 0 25%, rgb(var(--surface)) 0 50%) 0 0 / 24px 24px; border: 1px solid rgb(var(--line)); padding: 20px; }
    .tcard { position: relative; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.28); transition: width .25s, height .25s, border-radius .25s; }
    .tcard .art { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .tcard .sheen { position: absolute; inset: 0; pointer-events: none; }
    .tcard.mat-bamboo .sheen { background: repeating-linear-gradient(90deg, rgba(120,80,30,.14) 0 2px, transparent 2px 8px); }
    .tcard.mat-steel .sheen { background: linear-gradient(115deg, rgba(255,255,255,.38), rgba(255,255,255,0) 40%, rgba(255,255,255,.26) 62%, rgba(0,0,0,.12)); }
    .tcard.mat-gold .sheen { background: linear-gradient(135deg, rgba(255,235,150,.5), rgba(255,255,255,0) 45%, rgba(190,140,30,.32)); }
    .tcard.mat-black .sheen { background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,0) 50%); }
    .tcard .in { position: relative; height: 100%; padding: 16px; display: flex; gap: 10px; }
    .tcard.land .in { flex-direction: row; align-items: center; }
    .tcard.port .in { flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
    .tcard .txt { flex: 1; min-width: 0; }
    .tcard h3 { margin: 0; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
    .tcard .tag { margin: 4px 0 0; font-size: .74rem; opacity: .9; overflow-wrap: anywhere; }
    .tcard .msg { margin: 8px 0 0; font-size: .66rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .qrbox { background: #fff; border-radius: 8px; padding: 4px; line-height: 0; flex: none; }
    .qrbox svg { width: 100%; height: 100%; display: block; }
    .tcard.land .qrbox { width: 88px; height: 88px; }
    .tcard.port.sq .qrbox { width: 82px; height: 82px; }
    .tcard.port.vt .qrbox { width: 112px; height: 112px; }
    .warn { color: #b45309; font-size: .82rem; min-height: 1.2em; margin-top: 8px; }
    .price { font-size: 1.5rem; font-weight: 800; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .note { padding: 10px 14px; border-radius: 12px; background: rgb(var(--surface2)); border: 1px solid rgb(var(--line)); font-size: .9rem; margin-top: 14px; }
    .mine { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgb(var(--line)); flex-wrap: wrap; }
    .mine:first-of-type { border-top: 0; }
    #msg { position: fixed; inset-inline: 16px; bottom: 16px; max-width: 480px; margin-inline: auto; padding: 12px 16px; border-radius: 12px; background: rgb(var(--fg)); color: rgb(var(--bg)); font-weight: 600; display: none; z-index: 20; text-align: center; }
    select.lang { width: auto; padding: 7px 10px; border-radius: 999px; }
    .hidden { display: none !important; }
    .sr { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="logo" href="index.html"><i>T</i> Tablyn <span class="muted" style="font-weight:600">/ Studio</span></a>
      <a class="btn small" id="backShop" href="index.html"></a>
      <a class="btn small" id="toAccount" href="account.html"></a>
      <label class="sr" for="langSel">Language</label>
      <select class="lang" id="langSel"><option value="en">EN</option><option value="fr">FR</option><option value="ar">ع</option></select>
    </div>
  </header>

  <main>
    <h1 id="pageTitle"></h1>
    <p class="muted" id="lead"></p>
    <div class="note hidden" id="banner"></div>

    <div class="layout">
      <div class="controls">
        <section class="card">
          <h2 data-i18n="s_brand"></h2>
          <label for="brand" data-i18n="f_brand"></label>
          <input type="text" id="brand" maxlength="30" autocomplete="off">
          <label for="tagline" data-i18n="f_tagline"></label>
          <input type="text" id="tagline" maxlength="40" autocomplete="off">
          <label for="message" data-i18n="f_message"></label>
          <input type="text" id="message" maxlength="35" autocomplete="off">
          <label for="menuUrl" data-i18n="f_url"></label>
          <input type="url" id="menuUrl" maxlength="200" placeholder="https://" inputmode="url" autocomplete="off">
          <p class="muted" id="qrNote" style="margin:6px 0 0"></p>
        </section>

        <section class="card">
          <h2 data-i18n="s_product"></h2>
          <div class="grid2">
            <div><label for="material" data-i18n="f_material"></label><select id="material"></select></div>
            <div><label for="shape" data-i18n="f_shape"></label><select id="shape"></select></div>
          </div>
          <label for="font" data-i18n="f_font"></label><select id="font"></select>
        </section>

        <section class="card">
          <h2 data-i18n="s_colours"></h2>
          <div class="swatches" id="swatches" role="group" aria-label="Colour presets"></div>
          <div class="grid3" style="margin-top:12px">
            <div><label for="cBg" data-i18n="f_cbg"></label><input type="color" id="cBg"></div>
            <div><label for="cFg" data-i18n="f_cfg"></label><input type="color" id="cFg"></div>
            <div><label for="cAc" data-i18n="f_cac"></label><input type="color" id="cAc"></div>
          </div>
          <p class="warn" id="contrast"></p>
        </section>

        <section class="card">
          <h2 data-i18n="s_art"></h2>
          <label for="artFile" data-i18n="f_art"></label>
          <input type="file" id="artFile" accept="image/png,image/jpeg,image/webp">
          <label for="artOp" data-i18n="f_artop"></label>
          <input type="range" id="artOp" min="10" max="100" step="5">
          <div class="actions"><button type="button" class="btn small danger" id="artClear"></button></div>
          <p class="muted" style="margin:8px 0 0" data-i18n="art_rights"></p>
        </section>

        <section class="card" id="mineCard">
          <h2 data-i18n="s_mine"></h2>
          <div id="mineList"></div>
        </section>
      </div>

      <aside class="preview">
        <div class="stage"><div class="tcard land mat-black" id="card" role="img" aria-label="Card preview"></div></div>
        <p class="muted" id="matLabel" style="text-align:center;margin:8px 0 0"></p>
        <section class="card" style="margin-top:14px">
          <div class="row">
            <div style="width:110px"><label for="qty" data-i18n="f_qty" style="margin-top:0"></label><input type="number" id="qty" min="1" max="500" step="1"></div>
            <div style="margin-inline-start:auto;text-align:end"><div class="muted" id="unitLine"></div><div class="price" id="total"></div></div>
          </div>
          <div class="actions">
            <button type="button" class="btn primary" id="addBtn"></button>
            <button type="button" class="btn" id="saveBtn"></button>
            <button type="button" class="btn" id="exportBtn"></button>
          </div>
          <p class="muted" id="status" style="margin:10px 0 0"></p>
          <div class="actions hidden" id="afterAdd">
            <a class="btn small" href="account.html" id="viewCart"></a>
            <a class="btn small primary" href="index.html#checkout" id="toOrder"></a>
          </div>
          <p class="muted" style="margin:10px 0 0;font-size:.8rem" data-i18n="concept"></p>
        </section>
      </aside>
    </div>
  </main>
  <div id="msg" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-data.js"></script>
  <script src="qr.js"></script>
  <script src="tablyn-studio.js"></script>
</body>
</html>
